version: "3.9"

services:
  python-ai-talk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-ai-talk
    restart: on-failure:1
    environment:
      ANONYMIZED_TELEMETRY: "False"
      TZ: Asia/Shanghai
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      MYSQL_HOST: "${MYSQL_HOST:-}"
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_USER: "${MYSQL_USER:-}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-pangbao_agent}"
      CONSOLE_SECRET_KEY: "${CONSOLE_SECRET_KEY:-}"
      AGENT_ADMIN_USERNAME: "${AGENT_ADMIN_USERNAME:-admin}"
      AGENT_ADMIN_PASSWORD: "${AGENT_ADMIN_PASSWORD:-}"
      INTERNAL_GATEWAY_URL: "${INTERNAL_GATEWAY_URL:-}"
      INTERNAL_GATEWAY_TOKEN: "${INTERNAL_GATEWAY_TOKEN:-}"
      REDIS_URL: "${REDIS_URL:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GLM_API_KEY: "${GLM_API_KEY:-}"
      SILICONFLOW_API_KEY: "${SILICONFLOW_API_KEY:-}"
      SILICONFLOW_BASE_URL: "${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}"
      MODELSCOPE_API_KEY: "${MODELSCOPE_API_KEY:-}"
      MODELSCOPE_BASE_URL: "${MODELSCOPE_BASE_URL:-https://api-inference.modelscope.cn/v1}"
      CHROMA_PERSIST_DIR: "${CHROMA_PERSIST_DIR:-/app/data/chroma_db}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}"
      CLEAR_FEEDING_INTENTS_ON_STARTUP: "${CLEAR_FEEDING_INTENTS_ON_STARTUP:-false}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    volumes:
      - ./data/chroma_db:/app/data/chroma_db
