# 构建本仓微服务镜像并 push 至阿里云 ACR。
# 触发（仅 tag；与 go_ai_talk 同构）：
#   git tag v1.0.0-rc.1 && git push origin v1.0.0-rc.1
#     → 测试命名空间，全量 2 服务，tag :v1.0.0-rc.1 + :<sha>
#   git tag v1.0.0-rc.2+talk && git push origin v1.0.0-rc.2+talk
#     → 仅 build/push python-ai-talk；ACR 主 tag 仍为 :v1.0.0-rc.2
#     → 部署时把服务器 PYTHON_AI_TALK_IMAGE_TAG 设为 v1.0.0-rc.2（不必改 prediction）
#   git tag v1.0.0-rc.3+prediction && git push origin v1.0.0-rc.3+prediction
#     → 仅 build/push python-prediction
#     → 部署时把服务器 PYTHON_PREDICTION_IMAGE_TAG 设为 v1.0.0-rc.3
#   git tag v1.0.0 && git push origin v1.0.0
#     → 生产命名空间，全量 2 服务（是否两边都升到该号由各 *_IMAGE_TAG 决定）
# 规则：vMAJOR.MINOR.PATCH（无 - 后缀）→ 生产；含 -rc/-beta 等 → 测试
# 构建范围后缀：+ 后为逗号分隔服务别名（talk、prediction；all=全量）
# 手动：Actions → Run workflow（workflow_dispatch，可选 services）
# primary_tag 须与「本次被构建服务」在服务器上的 PYTHON_AI_TALK_IMAGE_TAG /
# PYTHON_PREDICTION_IMAGE_TAG 对齐；两服务部署 tag 可以不同。
#
# ACR 凭证来自 GitHub Actions Secrets / Environments：
#   Repository secrets: ACR_USERNAME, ACR_PASSWORD
#   Environment test / prod: REGISTRY（服务器 pull 地址，可用 -vpc 域名）
# CI push 地址由 workflow 从 REGISTRY 去掉 -vpc 自动推导。

name: docker-acr

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_env:
        description: 推送目标命名空间
        required: true
        type: choice
        options:
          - test
          - prod
      image_tag:
        description: 镜像主 tag（base tag，如 v1.0.0-rc.1；须与被构建服务的 PYTHON_*_IMAGE_TAG 一致，不含 + 后缀）
        required: true
        type: string
      services:
        description: 可选，逗号分隔服务别名（如 talk 或 prediction,talk）；留空=全量 2 服务
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.resolve.outputs.deploy_env }}
      primary_tag: ${{ steps.resolve.outputs.primary_tag }}
      build_scope: ${{ steps.resolve.outputs.build_scope }}
      build_matrix_json: ${{ steps.resolve.outputs.build_matrix_json }}
    steps:
      - name: 解析目标环境、镜像 tag 与构建范围
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          DISPATCH_ENV: ${{ inputs.target_env }}
          DISPATCH_TAG: ${{ inputs.image_tag }}
          DISPATCH_SERVICES: ${{ inputs.services }}
        run: |
          set -euo pipefail

          # v1.0.0 → prod；v1.0.0-rc.1 → test（基于 base tag，不含 + 构建后缀）
          resolve_env_from_tag() {
            local tag="$1"
            if [[ ! "${tag}" == v* ]]; then
              echo "::error::tag 须以 v 开头: ${tag}" >&2
              exit 1
            fi
            if [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo prod
            else
              echo test
            fi
          }

          # 服务别名 → matrix id（与 ACR 仓库名一致）
          resolve_service_alias() {
            local raw="$1"
            local alias
            alias="$(echo "${raw}" | tr '[:upper:]' '[:lower:]' | xargs)"
            case "${alias}" in
              talk|ai-talk|python-ai-talk) echo "python-ai-talk" ;;
              prediction|python-prediction) echo "python-prediction" ;;
              all) echo "__all__" ;;
              "")
                echo "::error::服务别名不能为空" >&2
                return 1
                ;;
              *)
                echo "::error::未知服务别名: ${raw}（支持 talk、prediction、all）" >&2
                return 1
                ;;
            esac
          }

          dockerfile_for() {
            case "$1" in
              python-ai-talk) echo "Dockerfile.python-ai-talk" ;;
              python-prediction) echo "Dockerfile.python-prediction" ;;
              *)
                echo "::error::内部错误: 无 dockerfile 映射 id=$1" >&2
                return 1
                ;;
            esac
          }

          ALL_SERVICES=(python-ai-talk python-prediction)

          parse_build_scope() {
            local scope="$1"
            service_ids=()
            if [[ -z "${scope}" ]]; then
              service_ids=("${ALL_SERVICES[@]}")
              return 0
            fi
            local part resolved
            declare -A seen=()
            IFS=',' read -ra parts <<< "${scope}"
            for part in "${parts[@]}"; do
              part="$(echo "${part}" | xargs)"
              [[ -z "${part}" ]] && continue
              resolved="$(resolve_service_alias "${part}")"
              if [[ "${resolved}" == "__all__" ]]; then
                service_ids=("${ALL_SERVICES[@]}")
                return 0
              fi
              if [[ -z "${seen[${resolved}]:-}" ]]; then
                seen["${resolved}"]=1
                service_ids+=("${resolved}")
              fi
            done
            if [[ ${#service_ids[@]} -eq 0 ]]; then
              echo "::error::构建范围解析结果为空" >&2
              exit 1
            fi
          }

          build_matrix_json_from_ids() {
            local ids=("$@")
            local json="["
            local first=true
            local id df
            for id in "${ids[@]}"; do
              df="$(dockerfile_for "${id}")"
              if [[ "${first}" == true ]]; then
                first=false
              else
                json+=","
              fi
              json+="{\"id\":\"${id}\",\"dockerfile\":\"${df}\"}"
            done
            json+="]"
            echo "${json}"
          }

          deploy_env=""
          primary_tag=""
          build_scope=""
          tag_raw=""

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            deploy_env="${DISPATCH_ENV}"
            primary_tag="${DISPATCH_TAG}"
            build_scope="${DISPATCH_SERVICES:-}"
            if [[ -z "${primary_tag}" ]]; then
              echo "::error::workflow_dispatch 须填写 image_tag" >&2
              exit 1
            fi
            if [[ "${primary_tag}" == *+* ]]; then
              echo "::error::image_tag 须为 base tag（不含 + 后缀）；构建范围请填 services 输入" >&2
              exit 1
            fi
            echo "手动触发: env=${deploy_env} tag=${primary_tag} services=${build_scope:-<all>}"
          elif [[ "${GIT_REF}" == refs/tags/* ]]; then
            tag_raw="${GIT_REF#refs/tags/}"
            primary_tag="${tag_raw}"
            build_scope=""
            if [[ "${tag_raw}" == *+* ]]; then
              primary_tag="${tag_raw%%+*}"
              build_scope="${tag_raw#*+}"
            fi
            deploy_env="$(resolve_env_from_tag "${primary_tag}")"
            echo "tag push: git=${tag_raw} base=${primary_tag} scope=${build_scope:-<all>} → ${deploy_env}"
          else
            echo "::error::不支持的 ref: ${GIT_REF}（仅 push tag v* 或 workflow_dispatch）" >&2
            exit 1
          fi

          parse_build_scope "${build_scope}"
          matrix_json="$(build_matrix_json_from_ids "${service_ids[@]}")"

          if [[ -z "${build_scope}" ]]; then
            scope_label="all"
          else
            scope_label="partial"
          fi

          echo "deploy_env=${deploy_env}" >> "${GITHUB_OUTPUT}"
          echo "primary_tag=${primary_tag}" >> "${GITHUB_OUTPUT}"
          echo "build_scope=${scope_label}" >> "${GITHUB_OUTPUT}"
          echo "build_matrix_json=${matrix_json}" >> "${GITHUB_OUTPUT}"
          echo "构建 matrix: ${matrix_json}"

  build-push:
    needs: resolve-env
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.deploy_env }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-env.outputs.build_matrix_json) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 加载 ACR Secrets
        id: acr
        shell: bash
        env:
          DEPLOY_ENV: ${{ needs.resolve-env.outputs.deploy_env }}
          PRIMARY_TAG: ${{ needs.resolve-env.outputs.primary_tag }}
          BUILD_SCOPE: ${{ needs.resolve-env.outputs.build_scope }}
          REGISTRY_PULL: ${{ secrets.REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail

          RUNBOOK_HINT="docs/deploy-guide.md「ACR 与 CI」"

          validate_push_registry() {
            local reg="$1"
            local host ns suggested

            if [[ -z "${reg}" ]]; then
              echo "::error title=缺少 REGISTRY::请在 GitHub Environment '${DEPLOY_ENV}' 配置 secret REGISTRY=<域名>/<命名空间>，详见 ${RUNBOOK_HINT}"
              exit 1
            fi

            host="${reg%%/*}"
            if [[ "${host}" == "${reg}" ]]; then
              ns="(缺失)"
            else
              ns="${reg#*/}"
            fi

            echo "deploy_env: ${DEPLOY_ENV}"
            echo "build_scope: ${BUILD_SCOPE}"
            echo "push host: ${host}"
            echo "push namespace: ${ns}"

            if [[ "${reg}" == *"-vpc."* ]]; then
              suggested="${host/-vpc./.}"
              if [[ "${ns}" != "(缺失)" ]]; then
                suggested="${suggested}/${ns}"
              fi
              echo "::error title=REGISTRY 仍含 -vpc::GitHub Actions 公网 runner 无法 push VPC 专线地址"
              echo "::error::请检查 Environment '${DEPLOY_ENV}' 的 REGISTRY secret，推导后应为: ${suggested}"
              exit 1
            fi

            if [[ "${reg}" != *"/"* ]]; then
              echo "::error title=REGISTRY 缺少命名空间::格式须为 <公网域名>/<命名空间>"
              exit 1
            fi

            echo "✓ push registry 格式校验通过"
          }

          registry_pull="${REGISTRY_PULL}"
          acr_username="${ACR_USERNAME}"
          acr_password="${ACR_PASSWORD}"

          if [[ -z "${registry_pull}" ]]; then
            echo "::error title=缺少 REGISTRY::请在 GitHub Environment '${DEPLOY_ENV}' 配置 secret REGISTRY，详见 ${RUNBOOK_HINT}"
            exit 1
          fi
          if [[ -z "${acr_username}" ]]; then
            echo "::error title=缺少 ACR_USERNAME::请在 Repository secrets 配置 ACR_USERNAME"
            exit 1
          fi
          if [[ -z "${acr_password}" ]]; then
            echo "::error title=缺少 ACR_PASSWORD::请在 Repository secrets 配置 ACR_PASSWORD"
            exit 1
          fi

          registry_push="${registry_pull/-vpc./.}"
          validate_push_registry "${registry_push}"

          echo "::add-mask::${acr_password}"

          echo "env=${DEPLOY_ENV}" >> "${GITHUB_OUTPUT}"
          echo "registry=${registry_push}" >> "${GITHUB_OUTPUT}"
          echo "host=${registry_push%%/*}" >> "${GITHUB_OUTPUT}"
          echo "primary_tag=${PRIMARY_TAG}" >> "${GITHUB_OUTPUT}"
          echo "username=${acr_username}" >> "${GITHUB_OUTPUT}"
          echo "password=${acr_password}" >> "${GITHUB_OUTPUT}"

      - name: 解析镜像 tag
        id: tags
        shell: bash
        env:
          ACR_REGISTRY: ${{ steps.acr.outputs.registry }}
          MATRIX_ID: ${{ matrix.id }}
          PRIMARY_TAG: ${{ steps.acr.outputs.primary_tag }}
        run: |
          set -euo pipefail
          image="${ACR_REGISTRY}/${MATRIX_ID}"
          {
            echo "list<<EOF"
            echo "${image}:${PRIMARY_TAG}"
            echo "${image}:${GITHUB_SHA}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "primary=${PRIMARY_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Login ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr.outputs.host }}
          username: ${{ steps.acr.outputs.username }}
          password: ${{ steps.acr.outputs.password }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.list }}

      - name: 构建摘要
        shell: bash
        run: |
          echo "${{ matrix.id }} → [${{ steps.acr.outputs.env }}] ${{ steps.acr.outputs.registry }}:${{ steps.acr.outputs.primary_tag }} (+ ${GITHUB_SHA})"
